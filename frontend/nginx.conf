server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ { proxy_pass http://task-manager-api:8080; }
    location = /health { proxy_pass http://task-manager-api:8080; }
    location /actuator/ { proxy_pass http://task-manager-api:8080; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
