name: Task Manager CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  API_IMAGE: task-manager-api:${{ github.sha }}
  FRONTEND_IMAGE: task-manager-frontend:${{ github.sha }}

jobs:

  # ==========================================================
  # 1. BACKEND TEST + PACKAGE
  # ==========================================================
  backend:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Run backend tests
        run: mvn -B clean test

      - name: Package backend
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-api
          path: target/*.jar
          retention-days: 7


  # ==========================================================
  # 2. FRONTEND VALIDATION
  # ==========================================================
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify frontend files
        run: |
          test -f frontend/Dockerfile
          test -f frontend/nginx.conf
          test -f frontend/public/index.html
          test -f frontend/public/styles.css
          test -f frontend/public/app.js

      - name: Validate HTML
        run: |
          grep -q "<html" frontend/public/index.html
          grep -q "</html>" frontend/public/index.html

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/public/app.js

      - name: Validate CSS exists
        run: |
          test -s frontend/public/styles.css


  # ==========================================================
  # 3. BUILD API DOCKER IMAGE
  # ==========================================================
  api-image:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build \
            --tag "${{ env.API_IMAGE }}" \
            .

      - name: Verify API image
        run: |
          docker image inspect "${{ env.API_IMAGE }}"


  # ==========================================================
  # 4. BUILD FRONTEND DOCKER IMAGE
  # ==========================================================
  frontend-image:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            --tag "${{ env.FRONTEND_IMAGE }}" \
            ./frontend

      - name: Verify frontend image
        run: |
          docker image inspect "${{ env.FRONTEND_IMAGE }}"


  # ==========================================================
  # 5. SECURITY SCAN - API
  # ==========================================================
  api-security:
      - name: Trivy API image scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m


  # ==========================================================
  # 6. SECURITY SCAN - FRONTEND
  # ==========================================================
  frontend-security:
      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m

    # ==========================================================
  # 7. KUBERNETES VALIDATION
  # ==========================================================
  kubernetes:
    name: Kubernetes Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render base Kustomize
        run: |
          kubectl kustomize k8s/ > k8s-rendered.yaml

      - name: Validate base Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >
            -strict
            -summary
            k8s-rendered.yaml

      - name: Render production Kustomize
        run: |
          kubectl kustomize kustomize/overlays/prod \
            > prod-rendered.yaml

      - name: Validate production Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >
            -strict
            -summary
            prod-rendered.yaml
    # ==========================================================
  # 8. HELM VALIDATION
  # ==========================================================
  helm:
    name: Helm Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint helm/task-manager

      - name: Render Helm templates
        run: |
          helm template \
            task-manager \
            helm/task-manager \
            > helm-rendered.yaml

      - name: Validate Helm manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >
            -strict
            -summary
            helm-rendered.yaml

    # ==========================================================
  # 9. DOCKER COMPOSE VALIDATION
  # ==========================================================
  compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=ci-test-password
          GRAFANA_PASSWORD=ci-test-password
          EOF

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet


  # ==========================================================
  # 10. CI SUCCESS
  # ==========================================================
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - api-image
      - frontend-image
      - api-security
      - frontend-security
      - kubernetes
      - helm
      - compose

    steps:
      - name: CI summary
        run: |
          echo "=========================================="
          echo "       TASK MANAGER CI PASSED"
          echo "=========================================="
          echo ""
          echo "Backend tests       : PASSED"
          echo "Frontend validation : PASSED"
          echo "API Docker build    : PASSED"
          echo "Frontend build      : PASSED"
          echo "API security scan   : PASSED"
          echo "Frontend scan       : PASSED"
          echo "Kubernetes          : PASSED"
          echo "Helm                : PASSED"
          echo "Docker Compose      : PASSED"
          echo ""
          echo "=========================================="