services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-taskmanager}
      POSTGRES_USER: ${DB_USERNAME:-taskuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  task-manager-api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskmanager}
      DB_USERNAME: ${DB_USERNAME:-taskuser}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env}
    depends_on:
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - task-manager-api
  grafana:
    image: grafana/grafana:11.5.2
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in your shell or .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/task-manager.json:ro
    depends_on:
      - prometheus
volumes:
  postgres-data:
