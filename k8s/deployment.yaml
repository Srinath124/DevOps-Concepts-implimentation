apiVersion: apps/v1
kind: Deployment
metadata: { name: task-manager-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: task-manager-api } }
  template:
    metadata: { labels: { app: task-manager-api } }
    spec:
      containers:
        - name: api
          image: task-manager-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: task-manager-config }
            - secretRef: { name: task-manager-secret }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 15 }
