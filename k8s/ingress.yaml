apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: task-manager }
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: task-manager-frontend, port: { number: 80 } } } }
          - { path: /api, pathType: Prefix, backend: { service: { name: task-manager-api, port: { number: 80 } } } }
          - { path: /health, pathType: Exact, backend: { service: { name: task-manager-api, port: { number: 80 } } } }
