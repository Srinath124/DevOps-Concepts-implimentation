apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-frontend }
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector: { matchLabels: { app: {{ .Release.Name }}-frontend } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-frontend } }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-frontend }
spec:
  selector: { app: {{ .Release.Name }}-frontend }
  ports: [{ port: 80, targetPort: 8080 }]
